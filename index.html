<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꿈드리미 매장찾기</title>

<!-- PWA -->
<link rel="manifest" href="/dream-store-map/manifest.json">
<meta name="theme-color" content="#5b6cf8">

<!-- Kakao -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ad60a91356b39c81913945dae75a92a7&autoload=false&libraries=clusterer"></script>

<style>
body{margin:0;font-family:sans-serif;}
#map{width:100%;height:100vh;}

/* 설치 버튼 */
#installBtn{
position:fixed;
bottom:140px;
left:50%;
transform:translateX(-50%);
background:#5b6cf8;
color:#fff;
border:none;
padding:12px 18px;
border-radius:10px;
font-weight:bold;
display:none;
z-index:999;
}
</style>
</head>

<body>

<div id="map"></div>

<button id="installBtn">앱 설치하기</button>

<script>
let map;

kakao.maps.load(()=>{
  map = new kakao.maps.Map(document.getElementById('map'),{
    center:new kakao.maps.LatLng(35.1595,126.8526),
    level:5
  });
});
</script>

<!-- 🔥 PWA 설치 스크립트 -->
<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display='block';
});

document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  console.log(outcome);
  deferredPrompt=null;
  document.getElementById('installBtn').style.display='none';
});
</script>

<!-- 🔥 Service Worker -->
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/dream-store-map/service-worker.js');
}
</script>

</body>
</html>
